version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-schema-rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=your-secret-key
    networks:
      - schema-rag-network

networks:
  schema-rag-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local

