services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-schema-rag
    restart: unless-stopped
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - schema-rag-network

volumes:
  qdrant_data:
    driver: local

networks:
  schema-rag-network:
    driver: bridge
